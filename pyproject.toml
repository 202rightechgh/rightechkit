[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "righttekit"
version = "0.1.0"
description = "A clean toolkit for bootstrapping and running Python backend services."
readme = "README.md"
license = "Apache-2.0"
authors = ["Miles"]
keywords = ["cli", "fastapi", "toolkit", "uvicorn", "backend"]
packages = [{ include = "righttekit" }]

[tool.poetry.dependencies]
python = "^3.12"
click = ">=8.1.7"
fastapi = ">=0.116.0"
uvicorn = ">=0.30.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0"
pytest-cov = ">=5.0.0"
ruff = ">=0.11.0"

[tool.poetry.scripts]
right = "righttekit.cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
