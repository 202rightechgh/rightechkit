[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "righttekit"
version = "0.1.0"
description = "A clean toolkit for bootstrapping and running Python backend services."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Miles" }
]
keywords = ["cli", "fastapi", "toolkit", "uvicorn", "backend"]
dependencies = [
  "click>=8.1.7",
  "fastapi>=0.116.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.11.0",
]

[project.scripts]
right = "righttekit.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["righttekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
